name: CI

on:
  push:
    branches: [main, feat/phase-05b-postgresql-backend]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  browser-tests:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # The apt step behind --with-deps occasionally fails when the Ubuntu
        # mirrors are unreachable, which fails the whole job even though the
        # browser download itself is fine. Fall back to the browser alone.
        run: npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Production build
        run: npm run build

      - name: Playwright tests
        run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
