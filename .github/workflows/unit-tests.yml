name: Unit Tests

on:
  push:
    branches: [main, feat/phase-05a-commerce-foundation, feat/phase-05b-postgresql-backend]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: echoair
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: echoair_test
        options: >-
          --health-cmd "pg_isready -U echoair -d echoair_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://echoair:changeme@localhost:5432/echoair_test?schema=public"
          DIRECT_URL: "postgresql://echoair:changeme@localhost:5432/echoair_test?schema=public"

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://echoair:changeme@localhost:5432/echoair_test?schema=public"
          DIRECT_URL: "postgresql://echoair:changeme@localhost:5432/echoair_test?schema=public"

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: "postgresql://echoair:changeme@localhost:5432/echoair_test?schema=public"
          DIRECT_URL: "postgresql://echoair:changeme@localhost:5432/echoair_test?schema=public"
          TEST_DATABASE_URL: "postgresql://echoair:changeme@localhost:5432/echoair_test?schema=public"
